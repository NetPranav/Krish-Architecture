name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to manually trigger the build

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Frontend Dependencies
        working-directory: ./AI-Krishi-kapil-krishi/AI-Krishi-kapil-krishi
        run: npm install

      - name: Build Next.js App
        working-directory: ./AI-Krishi-kapil-krishi/AI-Krishi-kapil-krishi
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://krish-architecture.onrender.com

      - name: Sync Capacitor
        working-directory: ./AI-Krishi-kapil-krishi/AI-Krishi-kapil-krishi
        run: npx cap sync android

      - name: Build Android APK (Debug)
        working-directory: ./AI-Krishi-kapil-krishi/AI-Krishi-kapil-krishi/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartAgri-App
          path: ./AI-Krishi-kapil-krishi/AI-Krishi-kapil-krishi/android/app/build/outputs/apk/debug/app-debug.apk
